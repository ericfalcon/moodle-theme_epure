name: Moodle plugin CI

# The documentation (Markdown: docs/, README, CHANGES…) does not run the tests: a change made only of it is published
# without them. A change with any other file runs them all.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  # Every Saturday, after the weekly releases of Moodle (Friday): the stable branches and the development version (6.0)
  # change without any change of the theme, and what breaks is seen the same week.
  schedule:
    - cron: '17 5 * * 6'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        # Moodle 5.3 requires PostgreSQL 17; the earlier versions run on 16.
        image: postgres:${{ matrix.include-moodle.pg || '16' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      # MariaDB 11.4 meets the requirements of Moodle 4.5 to 5.3 (5.3 requires 11.4).
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_CHARACTER_SET_SERVER: utf8mb4
          MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include-moodle:
          # The course formats (formats) and the activities (activities) of other plugins: the formats of
          # tests/behat/course_formats_plugins.feature and the 47 activities most installed that the guide reads
          # (tests/behat/activity_plugins.feature), each on a version of Moodle it supports, at its branch for it:
          # repository@branch, separated by spaces.
          - { branch: MOODLE_405_STABLE, php: '8.1', formats: 'gjb2048/moodle-format_grid@MOODLE_405 gjb2048/moodle-format_topcoll@MOODLE_405 ericfalcon/moodle-format_sectiontabs@main davidherney/moodle-format_onetopic@MOODLE_405_STABLE jrangelardila/moodle-format_buttons@4.5', activities: 'CinecaElearning/moodle-mod_attendanceregister@MOODLE_45_STABLE danmarsden/moodle-mod_dialogue@MOODLE_405_STABLE catalyst/moodle-mod_facetoface@MOODLE_403_STABLE catalyst/moodle-mod_reengagement@MOODLE_405_STABLE center-for-learning-management/moodle-mod_msteams@master' }
          # The visual regression runs on this job only (tests/behat/visual.feature).
          - { branch: MOODLE_405_STABLE, php: '8.3', certificate: MOODLE_400_STABLE, visual: true }
          - { branch: MOODLE_500_STABLE, php: '8.3', certificate: MOODLE_500_STABLE, activities: 't6nis/moodle-mod_mindmap@master rwthmoodle/moodle-mod_pdfannotator@main bdecentgmbh/moodle-mod_pulse@main' }
          # Behat in Firefox on this job; Chrome on the others.
          - { branch: MOODLE_501_STABLE, php: '8.3', certificate: MOODLE_500_STABLE, browser: firefox, activities: 'open-lms-open-source/moodle-mod_hsuforum@MOODLE_501_STABLE bycs-lp/mod_learningmap@master bozoh/moodle-mod_simplecertificate@MOODLE_501_STABLE oliviervalentin/moodle-mod_stickynotes@MOODLE_501_STABLE studentquiz/moodle-mod_studentquiz@main' }
          # The pages in WebKit (Safari, iPhone) and in forced colours on this job (tests/browsers).
          - { branch: MOODLE_502_STABLE, php: '8.3', certificate: MOODLE_500_STABLE, browsers: true, formats: 'gjb2048/moodle-format_topcoll@MOODLE_502 marinaglancy/moodle-format_flexsections@MOODLE_500_STABLE ericfalcon/moodle-format_tiles@MOODLE_502_STABLE ericfalcon/moodle-format_sectiontabs@main davidherney/moodle-format_onetopic@MOODLE_502_STABLE jrangelardila/moodle-format_buttons@5.x bdecentgmbh/moodle-format_designer@main', activities: 'projectestac/moodle-mod_geogebra@master h5p/h5p-moodle-plugin@stable academic-moodle-cooperation/moodle-mod_offlinequiz@MOODLE_502_STABLE academic-moodle-cooperation/moodle-mod_organizer@MOODLE_502_STABLE academic-moodle-cooperation/moodle-mod_publication@MOODLE_502_STABLE learnweb/moodle-mod_scheduler@MOODLE_502_STABLE bdecentgmbh/moodle-mod_videotime@master' }
          - { branch: MOODLE_503_STABLE, php: '8.4', pg: '17', certificate: MOODLE_500_STABLE, formats: 'marinaglancy/moodle-format_flexsections@MOODLE_500_STABLE ericfalcon/moodle-format_sectiontabs@main davidherney/moodle-format_onetopic@master jrangelardila/moodle-format_buttons@5.x james-cnz/moodle-format_multitopic@master', activities: 'danmarsden/moodle-mod_attendance@MOODLE_503_STABLE brickfield/moodle-mod_board@main EduardoKrausME/moodle-mod_certificatebeautiful@master davosmith/moodle-checklist@master ndunand/moodle-mod_choicegroup@master mdjnelson/moodle-mod_customcert@MOODLE_503_STABLE drachels/moodle-mod_diary@master bdaloukas/moodle-mod_game@MOODLE_20_STABLE gbateson/moodle-mod_hotpot@master drachels/moodle-mod_icontent@master sokunthearithmakara/mod_interactivevideo@main sergiocomeron/moodle-mod_jitsi@master elearningsoftware/moodle-mod_journal@master PoetOS/moodle-mod_questionnaire@MOODLE_503_STABLE grabs/moodle-mod_unilabel@main' }
          # Questionnaire and Unilabel on PostgreSQL: on MariaDB, some of their tables are missing from the database of
          # PHPUnit. Edwiser (format_remuiformat), from the Moodle Marketplace only: its archive is in .github/plugins (archives).
          - { branch: MOODLE_405_STABLE, php: '8.3', db: mariadb, archives: 'format_remuiformat_2026111800.zip' }
          - { branch: MOODLE_503_STABLE, php: '8.4', db: mariadb, archives: 'format_remuiformat_2026111800.zip', activities: 'open-lms-open-source/moodle-mod_lightboxgallery@master netspotau/moodle-mod_mediagallery@master EduardoKrausME/moodle-mod_pdfprotect@master davosmith/moodle-realtimequiz@master catalyst/moodle-mod_subcourse@MOODLE_503_STABLE EduardoKrausME/moodle-mod_supervideo@master junpataleta/moodle-mod_threesixo@main turnitin/moodle-mod_turnitintooltwo@master jcrodriguez-dis/moodle-mod_vpl@master jrchamp/moodle-mod_zoom@main Wunderbyte-GmbH/moodle-local_wunderbyte_table@main Wunderbyte-GmbH/moodle-mod_booking@main' }
          # IOMAD, whose tables and classes were renamed in 5.1 (theme_epure\iomad knows both).
          - { branch: IOMAD_405_STABLE, php: '8.3', repo: 'https://github.com/iomad/iomad.git', certificate: MOODLE_400_STABLE }
          - { branch: IOMAD_500_STABLE, php: '8.3', repo: 'https://github.com/iomad/iomad.git', certificate: MOODLE_500_STABLE }
          - { branch: IOMAD_501_STABLE, php: '8.3', repo: 'https://github.com/iomad/iomad.git', certificate: MOODLE_500_STABLE }
          - { branch: IOMAD_502_STABLE, php: '8.3', repo: 'https://github.com/iomad/iomad.git', certificate: MOODLE_500_STABLE }
          # The development version of Moodle (6.0), not supported yet: it tells early what changes, without blocking a
          # merge (continue-on-error below).
          - { branch: main, php: '8.4', pg: '17', experimental: true }

    # The job of the development version of Moodle may fail without failing the workflow.
    continue-on-error: ${{ matrix.include-moodle.experimental || false }}

    name: theme_epure — ${{ matrix.include-moodle.branch }} — PHP ${{ matrix.include-moodle.php }} — ${{ matrix.include-moodle.db || 'pgsql' }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.include-moodle.php }}
          extensions: pgsql, mysqli, zip, gd, xmlrpc, soap
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      # IOMAD: its themes declare third-party files they do not ship (amd/src/bootstrap/, amd/src/index.js), which
      # stops moodle-plugin-ci (grunt ignorefiles); they are added, empty, to a local clone, installed from there.
      # The index of auth_iomadoidc (IOMAD 5.2) gets the prefix of the tables, for PHPUnit and Behat to install side by side,
      # and tool_checklearningrecords (IOMAD 5.1, 5.2) the string it uses without defining it.
      - name: Prepare IOMAD
        if: ${{ matrix.include-moodle.repo }}
        run: |
          git clone -q --depth 1 --branch "${{ matrix.include-moodle.branch }}" "${{ matrix.include-moodle.repo }}" iomad-src
          python3 - <<'PY'
          import glob, os, re
          for xml in glob.glob('iomad-src/**/thirdpartylibs.xml', recursive=True):
              base = os.path.dirname(xml)
              for location in re.findall(r'<location>\s*([^<]+?)\s*</location>', open(xml, encoding='utf-8').read()):
                  path = os.path.join(base, location)
                  if '*' in location or os.path.exists(path):
                      continue
                  print('Missing in IOMAD, added empty:', path)
                  if location.endswith('/'):
                      os.makedirs(path, exist_ok=True)
                      open(os.path.join(path, '.gitkeep'), 'w').close()
                  else:
                      os.makedirs(os.path.dirname(path), exist_ok=True)
                      open(path, 'w').close()
          # IOMAD 5.2: auth_iomadoidc names an index without the prefix of the tables, which PHPUnit and Behat share.
          for php in glob.glob('iomad-src/**/auth/iomadoidc/db/*.php', recursive=True):
              code = open(php, encoding='utf-8').read()
              fixed = code.replace("CREATE UNIQUE INDEX idx_iomadoidc_unique ON",
                                   "CREATE UNIQUE INDEX ' . $DB->get_prefix() . 'iomadoidc_uniq ON")
              if fixed != code:
                  print('Index of auth_iomadoidc prefixed:', php)
                  open(php, 'w', encoding='utf-8').write(fixed)
          # IOMAD 5.1 and 5.2: tool_checklearningrecords uses a string it does not define, during the install of Behat.
          for lang in glob.glob('iomad-src/**/tool/checklearningrecords/lang/en/tool_checklearningrecords.php', recursive=True):
              code = open(lang, encoding='utf-8').read()
              if "'brokendetails'" not in code:
                  print('String brokendetails added:', lang)
                  open(lang, 'a', encoding='utf-8').write("$string['brokendetails'] = 'Records still broken: {$a}';\n")
          PY
          # The Behat contexts of the plugins of IOMAD are left out: several stop Behat (auth_iomadsaml2's is not
          # compatible on IOMAD 4.5, tool_iomadpolicy's defines again a step of tool_policy, local_iomadcustompage's
          # generator is loaded before the class it extends); the scenarios of Épure use none of their steps.
          find iomad-src -type d -path '*/tests/behat' | while read -r dir; do
            case "${dir#iomad-src/}" in
              *iomad*) echo "Behat of IOMAD left out: $dir"; rm -rf "$dir" ;;
            esac
          done
          git -C iomad-src add -A
          git -C iomad-src -c user.name=CI -c user.email=ci@example.com commit -q -m "CI: directory of theme_iomad" || true
          echo "IOMAD_LOCAL=file://$GITHUB_WORKSPACE/iomad-src" >> "$GITHUB_ENV"

      # The plugin Certificate (tool_certificate), for the template of certificate in the colours of the brand.
      - name: Add the plugin Certificate
        if: ${{ matrix.include-moodle.certificate }}
        run: moodle-plugin-ci add-plugin --branch ${{ matrix.include-moodle.certificate }} moodleworkplace/moodle-tool_certificate

      # The activity Course certificate (mod_coursecertificate), from the fork of the maintainer of Épure: the
      # certificates issued in the courses, with the template of Épure. On the versions it supports (4.5 to 5.2): on
      # Moodle 5.3, its page for a learner stops on an exception of the plugin, and the scenario is skipped.
      - name: Add the activity Course certificate
        if: ${{ matrix.include-moodle.certificate && matrix.include-moodle.branch != 'MOODLE_503_STABLE' }}
        run: moodle-plugin-ci add-plugin --branch ${{ matrix.include-moodle.certificate }} ericfalcon/moodle-mod_coursecertificate

      # The course formats of other plugins, on the jobs that list them (formats).
      - name: Add the course formats of other plugins
        if: ${{ matrix.include-moodle.formats }}
        run: |
          for spec in ${{ matrix.include-moodle.formats }}; do
            moodle-plugin-ci add-plugin --branch "${spec#*@}" "${spec%@*}"
          done

      # The activities of other plugins read by the guide, on the jobs that list them (activities).
      - name: Add the activities of other plugins
        if: ${{ matrix.include-moodle.activities }}
        run: |
          for spec in ${{ matrix.include-moodle.activities }}; do
            moodle-plugin-ci add-plugin --branch "${spec#*@}" "${spec%@*}"
          done
          # Some keep part of their code in submodules (mod_hvp: the library of H5P), which add-plugin does not fetch.
          for dir in moodle-plugin-ci-plugins/*/; do
            if [ -f "$dir.gitmodules" ]; then
              git -C "$dir" submodule update --init --recursive --depth 1
            fi
          done

      # The plugins of the Moodle Marketplace without a repository of their code: their archives, in .github/plugins, with
      # the other plugins added, which the installation copies into Moodle.
      - name: Add the plugins of other archives
        if: ${{ matrix.include-moodle.archives }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/moodle-plugin-ci-plugins"
          for archive in ${{ matrix.include-moodle.archives }}; do
            unzip -q "repo/.github/plugins/$archive" -d "$GITHUB_WORKSPACE/moodle-plugin-ci-plugins"
          done
          echo "EXTRA_PLUGINS_DIR=$GITHUB_WORKSPACE/moodle-plugin-ci-plugins" >> "$GITHUB_ENV"

      # The scenarios of the formats and activities of other plugins are not run: left out, as gherkinlint refuses those
      # of some (names used twice). Moodle is not there yet: they are the plugins added whose component starts with
      # format_, mod_ or local_.
      - name: Leave out the scenarios of the other plugins
        if: ${{ matrix.include-moodle.formats || matrix.include-moodle.activities || matrix.include-moodle.archives }}
        run: |
          find . -maxdepth 4 -name version.php -not -path './repo/*' -not -path './ci/*' | while read -r file; do
            if grep -qE "component *= *['\"](format|mod|local)_" "$file"; then
              find "$(dirname "$file")/tests/behat" -name '*.feature' -print -delete 2>/dev/null || true
            fi
          done

      - name: Install Moodle and the plugin
        # Without the history of git: moodle-plugin-ci 4.5.12 copies the plugin back after grunt, and cannot write
        # over the read-only packs of git.
        run: |
          rm -rf ./repo/.git
          moodle-plugin-ci install --plugin ./repo --db-host=127.0.0.1
        env:
          DB: ${{ matrix.include-moodle.db || 'pgsql' }}
          MOODLE_BRANCH: ${{ matrix.include-moodle.branch }}
          MOODLE_REPO: ${{ env.IOMAD_LOCAL || matrix.include-moodle.repo || 'https://github.com/moodle/moodle.git' }}

      - name: PHP lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Moodle code checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      # Not on IOMAD: its themes copy Boost's Behat features under the same names, which gherkinlint refuses; the
      # code of Épure is linted on the Moodle jobs.
      - name: Grunt
        if: ${{ !cancelled() && !matrix.include-moodle.repo }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      # veraPDF, the validator of the PDF/UA, from Maven Central: the PDF of « My summary » is checked against PDF/UA-1 by
      # the PHPUnit tests (EPURE_VERAPDF), where it is tagged (PHP 8.2 and later). Maven gets it in a repository of its
      # own (not the cache of the runner), with five tries; when Maven Central does not answer this runner, the job says
      # so and its tests run without veraPDF: the other jobs check the PDF.
      - name: veraPDF
        if: ${{ !cancelled() && matrix.include-moodle.php != '8.1' }}
        run: |
          mkdir -p "$RUNNER_TEMP/verapdf"
          cd "$RUNNER_TEMP/verapdf"
          printf '%s' '<project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion><groupId>local</groupId><artifactId>verapdf</artifactId><version>1</version><dependencies><dependency><groupId>org.verapdf.apps</groupId><artifactId>greenfield-apps</artifactId><version>1.28.2</version></dependency></dependencies></project>' > pom.xml
          for try in 1 2 3 4 5; do
            if mvn -B -q -U -Dmaven.repo.local="$RUNNER_TEMP/m2" \
                org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies -DoutputDirectory=lib; then
              printf '#!/bin/sh\nexec java -cp "%s/lib/*" org.verapdf.apps.GreenfieldCliWrapper "$@"\n' "$RUNNER_TEMP/verapdf" > verapdf
              chmod +x verapdf
              ./verapdf --version
              echo "EPURE_VERAPDF=$RUNNER_TEMP/verapdf/verapdf" >> "$GITHUB_ENV"
              exit 0
            fi
            rm -rf "$RUNNER_TEMP/m2"
            sleep 30
          done
          echo "::warning::veraPDF could not be downloaded from Maven Central: the PDF/UA is not checked on this job."

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      # Behat, with the accessibility checks (axe) and the pre-audit (the same pages, each in light, dark and on phones),
      # on every job: every version of Moodle and IOMAD, every version of PHP, PostgreSQL and MariaDB. All the scenarios
      # on IOMAD, all but those of IOMAD on Moodle. The page of a failed step in full in the log (--dump): a failure that
      # comes now and then, on one job, is read from it.
      - name: Behat tests
        if: ${{ !cancelled() }}
        run: set -o pipefail; moodle-plugin-ci behat --profile ${{ matrix.include-moodle.browser || 'chrome' }} --dump --tags '${{ matrix.include-moodle.repo && '@theme_epure' || '@theme_epure&&~@theme_epure_iomad' }}' 2>&1 | tee "$RUNNER_TEMP/behat.log"
        env:
          # The visual regression: its images (new pages, differences) in this folder, on one job only.
          EPURE_VISUAL: ${{ matrix.include-moodle.visual && format('{0}/visual', github.workspace) || '' }}

      # The pages of a learner in WebKit (Safari on a computer and on an iPhone), which Behat does not drive, and in the
      # forced colours of the Windows contrast themes: no error of JavaScript, no violation of axe, nothing wider than the
      # screen (tests/browsers/check.js). On the site of the tests, served by PHP; its images kept 30 days.
      - name: WebKit and forced colours
        if: ${{ !cancelled() && matrix.include-moodle.browsers }}
        run: |
          # From Moodle 5.1, the files served are in public/.
          root=moodle/public; [ -d "$root" ] || root=moodle
          sed -i "s#^\$CFG->wwwroot *=.*#\$CFG->wwwroot = 'http://localhost:8010';#" moodle/config.php
          course=$(php "$root/theme/epure/tests/browsers/setup.php" | tail -1)
          (php -S localhost:8010 -t "$root" > "$RUNNER_TEMP/php.log" 2>&1 &)
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm install --no-save --no-audit --no-fund playwright@1.49.1 axe-core@4.10.2
          npx playwright install --with-deps webkit chromium
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node "$GITHUB_WORKSPACE/$root/theme/epure/tests/browsers/check.js" \
            http://localhost:8010 "$course"
        env:
          EPURE_BROWSERS: ${{ github.workspace }}/browsers

      - name: Images of WebKit and forced colours
        if: ${{ !cancelled() && matrix.include-moodle.browsers }}
        uses: actions/upload-artifact@v4
        with:
          name: browsers
          path: browsers/

      # The failed steps of Behat at the very end of the log, without the pages dumped: read first.
      - name: Summary of the failures of Behat
        if: ${{ failure() }}
        run: |
          [ -f "$RUNNER_TEMP/behat.log" ] || exit 0
          grep -vE '^\s*\|' "$RUNNER_TEMP/behat.log" | grep -E '^[0-9]{3} (Scenario|Example)|^\s+(And|Then|When|Given) |failures:|\((light|dark|yellow|cream|text)[^)]*\)|violations of rule|^\s+[.#a-z\[][^ ]*$|contrast of|scrolls across|Exception|Warning|does not exist|not found' \
            | cut -c1-300 | awk '!seen[$0]++' | head -400

      # The images of the visual regression: the pages without a reference, and those that differ, with their
      # differences in red. Kept 30 days.
      - name: Images of the visual regression
        if: ${{ !cancelled() && matrix.include-moodle.visual }}
        uses: actions/upload-artifact@v4
        with:
          name: visual
          path: visual/
          if-no-files-found: ignore
          retention-days: 30

      # The same images in the log, as a base64 tar between two markers, for whoever can read the logs but not
      # download the artifacts.
      - name: Images of the visual regression, in the log
        if: ${{ !cancelled() && matrix.include-moodle.visual }}
        run: |
          if [ -d visual ]; then
            echo "EPURE-VISUAL-BEGIN"
            tar -czf - -C visual . | base64 -w 0
            echo
            echo "EPURE-VISUAL-END"
          fi
